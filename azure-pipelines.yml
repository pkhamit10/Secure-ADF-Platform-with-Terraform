trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # Azure DevOps service connection (workload identity federation) to the subscription
  serviceConnection: Secure-ADF
  terraformVersion: 1.9.8

stages:
  - stage: Plan
    displayName: Validate and plan
    jobs:
      - job: plan
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - script: terraform fmt -check -recursive
            displayName: Format check

          - task: AzureCLI@2
            displayName: Terraform init, validate, plan
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init -input=false
                terraform validate
                terraform plan -input=false -out=$(Build.ArtifactStagingDirectory)/tfplan

          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            artifact: tfplan
            displayName: Publish plan

  - stage: Apply
    displayName: Apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      # Add approvals/checks to the "production" environment in Azure DevOps
      - deployment: apply
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)

                - download: current
                  artifact: tfplan

                - task: AzureCLI@2
                  displayName: Terraform init and apply
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_OIDC_TOKEN=$idToken
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      terraform init -input=false
                      terraform apply -input=false $(Pipeline.Workspace)/tfplan/tfplan
